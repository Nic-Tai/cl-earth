<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Earth Check-in</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 3D Earth Container -->
        <div id="earth-container"></div>

        <!-- UI Overlay -->
        <div id="ui-overlay">
            <!-- Header -->
            <header id="header">
                <h1>🌍 Earth Explorer</h1>
                <p class="subtitle">Check in to amazing destinations around the world</p>
            </header>

            <!-- Home Location Panel -->
            <div id="home-panel" class="panel">
                <h3>📍 Your Home</h3>
                <select id="home-select">
                    <option value="">Select your home city...</option>
                </select>
                <div id="home-info" class="location-info hidden"></div>
            </div>

            <!-- Destinations Panel -->
            <div id="destinations-panel" class="panel">
                <h3>✈️ Destinations</h3>
                <div id="destinations-list"></div>
            </div>

            <!-- Check-in Status -->
            <div id="checkin-status" class="panel hidden">
                <h3>🎉 Checked In!</h3>
                <div id="checkin-details"></div>
                <button id="close-checkin" class="btn">Close</button>
            </div>

            <!-- Progress Tracker -->
            <div id="progress-tracker" class="panel">
                <div class="progress-header">
                    <span class="progress-icon">🌎</span>
                    <span class="progress-title">World Explorer</span>
                </div>
                <div class="progress-stats">
                    <span id="visited-count">0</span>/<span id="total-count">12</span> destinations
                </div>
                <div class="progress-bar-container">
                    <div id="visited-progress-bar" class="visited-progress-bar"></div>
                </div>
                <div id="progress-message" class="progress-message">Start your journey!</div>
            </div>

            <!-- Stats Dashboard -->
            <div id="stats-dashboard" class="panel">
                <div class="stats-header">
                    <span class="stats-icon">📊</span>
                    <span class="stats-title">Travel Stats</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="total-distance-stat">0</span>
                        <span class="stat-label">km traveled</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="countries-stat">0</span>
                        <span class="stat-label">countries</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="continents-stat">0</span>
                        <span class="stat-label">continents</span>
                    </div>
                </div>
            </div>

            <!-- Achievements Panel -->
            <div id="achievements-panel" class="panel">
                <div class="achievements-header">
                    <span class="achievements-icon">🏆</span>
                    <span class="achievements-title">Achievements</span>
                    <span id="badges-count" class="badges-count">0/8</span>
                </div>
                <div id="badges-grid" class="badges-grid">
                    <!-- Badges will be populated by JavaScript -->
                </div>
            </div>

            <!-- Controls Panel -->
            <div id="controls-panel">
                <button id="sound-toggle" class="control-btn" title="Toggle Sound">
                    🔊
                </button>
                <button id="day-night-toggle" class="control-btn" title="Toggle Day/Night">
                    ☀️
                </button>
                <button id="share-btn" class="control-btn" title="Share Progress">
                    📤
                </button>
            </div>
        </div>

        <!-- Flight Info Overlay (shown during animation) -->
        <div id="flight-info" class="hidden">
            <div class="flight-card">
                <div class="flight-header">
                    <span id="flight-from">---</span>
                    <span class="flight-icon">✈️</span>
                    <span id="flight-to">---</span>
                </div>
                <div class="flight-progress">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
                <div id="flight-distance" class="flight-distance"></div>
            </div>
        </div>

        <!-- Landmark Info Popup -->
        <div id="landmark-popup" class="hidden">
            <div class="popup-content">
                <button id="popup-close" class="popup-close">&times;</button>
                <h2 id="popup-title"></h2>
                <p id="popup-description"></p>
                <div id="popup-landmark-preview"></div>
                <button id="popup-checkin" class="btn btn-primary">Check In Here!</button>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loader">
                <div class="earth-loader"></div>
                <p>Loading Earth...</p>
            </div>
        </div>

        <!-- Version Display -->
        <div id="version-display">v1.5</div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Main Application -->
    <script src="app.js" type="module"></script>
</body>
</html>
